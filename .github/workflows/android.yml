steps:
  - name: Checkout
    uses: actions/checkout@v4

  - id: setup-java
    name: Set up JDK 11
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 11

  - name: Install Android SDK tools
    run: |
      sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
      sudo chown -R $USER:$USER $ANDROID_SDK_ROOT
      cd $ANDROID_SDK_ROOT
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O cmdline-tools.zip
      unzip -q cmdline-tools.zip -d cmdline-tools
      mv cmdline-tools/cmdline-tools cmdline-tools/latest
      yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

  - name: Accept licenses
    run: |
      yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT

  - name: Make Gradle wrapper executable (if present)
    run: |
      if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

  - name: Build debug APK
    run: |
      ./gradlew assembleDebug --no-daemon
    env:
      JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: app/build/outputs/apk/debug/*.apk
